[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "captus"
dynamic = ["version"]
description = "captus: pipeline to estimate the galactic abundance of primordial black holes captured by main sequence"
authors = [
  { name = "Aysu Ece Saricaoglu, AstroMusers" }
]
readme = "README.md"
license = { file = "LICENSE" }

keywords = ["astrophysics", "three body capture", "rebound"]

requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0",
    "astropy>=6.1",
    "matplotlib",
    "pandas",
    "rebound",
    "scipy",
    "PyYAML",
    "pytextable",
    "seaborn",
    "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed",
]

[project.scripts]
captus-binary-capture = "captus.three_body_capture.planetary_binary:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
]

plotting = ["corner", "bokeh"]

inference = [
  "chalcedon @ git+https://github.com/tansudaylan/chalcedon.git@7f904b64b854fe3bee63af515317723ed49c9b06",
  "pcat @ git+https://github.com/tansudaylan/pcat.git",
  "MulensModel>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/captus"]

[tool.hatch.build.targets.sdist]
# Default sdist behavior

[tool.hatch.metadata]
# Enable automatic package discovery within the top-level package directory
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Use a regex with a named 'version' group for tags like 'v0.1.0'
tag-pattern = "^v(?P<version>.*)$"

[tool.hatch.build.hooks.vcs]
version-file = "src/captus/_version.py"
local_scheme = "node-and-date"